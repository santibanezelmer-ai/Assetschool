[package]
name = "assetschool-linux-agent"
version = "0.1.0"
edition = "2021"
authors = ["AssetSchool Engineering Team"]
description = "Native Linux Agent for AssetSchool Classroom Management (Wayland ScreenCast & WebRTC)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
webrtc = { version = "0.11", optional = true }

[features]
default = []
webrtc-native = ["dep:webrtc"]
