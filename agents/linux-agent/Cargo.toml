[package]
name = "assetschool-linux-agent"
version = "0.1.0"
edition = "2021"
authors = ["AssetSchool Engineering Team"]
description = "Native Linux Agent for AssetSchool Classroom Management (Wayland ScreenCast & webrtc-rs)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full", "sync", "time"] }
webrtc = "0.11"
async-trait = "0.1"

[[bin]]
name = "assetschool-linux-agent"
path = "src/main.rs"
