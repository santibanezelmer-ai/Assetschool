<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AssetSchool WebRTC Real Video Transmission Test</title>
  <script src="/node_modules/socket.io-client/dist/socket.io.min.js"></script>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:20px;">
  <h2>AssetSchool WebRTC Real End-to-End Video Transmission Test</h2>
  <div style="display:flex; gap:20px;">
    <div>
      <h4>Agente Estudiante (Video Track Source - Animated Canvas)</h4>
      <canvas id="sourceCanvas" width="640" height="360" style="border:1px solid #444; background:#000;"></canvas>
    </div>
    <div>
      <h4>Consola Docente (HTML5 Video Element - Receiver)</h4>
      <video id="receiverVideo" autoplay playsinline muted width="640" height="360" style="border:1px solid #00f; background:#000;"></video>
    </div>
  </div>

  <pre id="log" style="background:#222; padding:15px; margin-top:20px; border-radius:8px; font-family:monospace;"></pre>

  <script>
    const logBox = document.getElementById('log');
    function log(msg) {
      const line = `[${new Date().toISOString().substring(11, 19)}] ${msg}`;
      logBox.innerText += line + '\n';
      console.log(line);
    }

    async function runTest() {
      try {
        log('1. Iniciando fuente de video sintética acelerada en Canvas 640x360 @ 30fps...');
        const canvas = document.getElementById('sourceCanvas');
        const ctx = canvas.getContext('2d');
        let frameCount = 0;

        // Render moving graphics on canvas so real video frames are continuously encoded
        function drawFrame() {
          frameCount++;
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, 640, 360);

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          const x = 320 + Math.sin(frameCount / 10) * 200;
          const y = 180 + Math.cos(frameCount / 10) * 100;
          ctx.arc(x, y, 30, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = '20px sans-serif';
          ctx.fillText(`AssetSchool Frame #${frameCount}`, 50, 50);
          ctx.fillText(`Timestamp: ${Date.now()}`, 50, 90);

          requestAnimationFrame(drawFrame);
        }
        drawFrame();

        const stream = canvas.captureStream(30);
        const videoTrack = stream.getVideoTracks()[0];
        log(`2. VideoTrack capturado: ID=${videoTrack.id}, Label=${videoTrack.label}, Enabled=${videoTrack.enabled}`);

        // 3. Connect to AgentGateway on port 3000
        log('3. Conectando sockets a AgentGateway (http://localhost:3000)...');
        const agentSocket = io('http://localhost:3000', { transports: ['websocket'] });
        const teacherSocket = io('http://localhost:3000', { transports: ['websocket'] });

        agentSocket.on('connect_error', (err) => log(`AGENT SOCK ERR: ${err.message}`));
        teacherSocket.on('connect_error', (err) => log(`TEACHER SOCK ERR: ${err.message}`));

        await Promise.all([
          new Promise((resolve) => agentSocket.on('connect', resolve)),
          new Promise((resolve) => teacherSocket.on('connect', resolve)),
        ]);
        log(`4. Sockets conectados: Agente=${agentSocket.id}, Docente=${teacherSocket.id}`);

        // 4. Handshake Agente con espera de confirmación
        log('4. Enviando AGENT_HELLO y esperando confirmación del servidor...');
        const helloPromise = new Promise((resolve) => {
          agentSocket.once('SERVER_HELLO_ACK', (ack) => {
            log(`4.1 SERVER_HELLO_ACK recibido: Enrolado=${ack.payload.isEnrolled}, DeviceId=${ack.payload.assignedDeviceId}`);
            resolve(ack);
          });
        });

        agentSocket.emit('AGENT_HELLO', {
          protocolVersion: '1.0.0',
          packetId: 'pkt_agent_01',
          packetType: 'AGENT_HELLO',
          senderId: '01010101-0101-0101-0101-010101010101',
          senderType: 'agent',
          timestamp: Date.now(),
          payload: {
            hostname: 'LAB01-PC-01',
            macAddress: '02:42:AC:11:00:02',
            localIp: '127.0.0.1',
            osType: 'windows',
            osVersion: 'Win11',
            architecture: 'x64',
            agentVersion: '1.0.0',
            publicKey: 'test_key',
            enrolledDeviceId: '01010101-0101-0101-0101-010101010101',
          },
        });
        await helloPromise;

        // 5. Auth Docente: Obtener JWT real mediante API REST /api/v1/auth/login
        log('5. Obteniendo token JWT real del docente en /api/v1/auth/login...');
        const authRes = await fetch('http://localhost:3000/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'profesor@assetschool.lan',
            password: 'Docente123!*',
          }),
        });
        const authData = await authRes.json();
        const teacherToken = authData.accessToken;
        log(`5.1 Token JWT emitido para ${authData.user.email} (Rol: ${authData.user.role})`);

        log('5.2 Autenticando Docente en WebSocket con JWT oficial...');
        await new Promise((resolve) => {
          teacherSocket.emit('TEACHER_JOIN_CLASSROOM', {
            token: teacherToken,
            classroomId: '11111111-1111-1111-1111-111111111111',
          }, (res) => {
            log(`5.3 Docente unido a sala: ${JSON.stringify(res)}`);
            resolve(res);
          });
          teacherSocket.once('TEACHER_JOIN_SUCCESS', (res) => {
            log(`5.3 Docente unido con éxito a sala: ${JSON.stringify(res)}`);
            resolve(res);
          });
          setTimeout(resolve, 500);
        });

        // 6. Configurar WebRTC PeerConnections
        const agentPc = new RTCPeerConnection({ iceServers: [] });
        const teacherPc = new RTCPeerConnection({ iceServers: [] });

        // Add real video track to agent PeerConnection
        agentPc.addTrack(videoTrack, stream);

        // Teacher video element setup
        const videoEl = document.getElementById('receiverVideo');
        const trackReceivedPromise = new Promise((resolve) => {
          teacherPc.ontrack = (event) => {
            log(`8. [DOCENTE] ontrack recibido! Track ID: ${event.track.id}, Streams: ${event.streams.length}`);
            videoEl.srcObject = event.streams[0];
            videoEl.play();
            resolve(event.streams[0]);
          };
        });

        // ICE candidate exchange
        agentPc.onicecandidate = (e) => {
          if (e.candidate) {
            agentSocket.emit('WEBRTC_ICE_CANDIDATE', {
              protocolVersion: '1.0.0',
              packetId: 'pkt_ice_a',
              packetType: 'WEBRTC_ICE_CANDIDATE',
              senderId: '01010101-0101-0101-0101-010101010101',
              senderType: 'agent',
              timestamp: Date.now(),
              payload: {
                sessionId: 'stream_test_e2e_real',
                senderId: '01010101-0101-0101-0101-010101010101',
                targetId: 'teacher',
                candidate: {
                  candidate: e.candidate.candidate,
                  sdpMid: e.candidate.sdpMid,
                  sdpMLineIndex: e.candidate.sdpMLineIndex,
                },
              },
            });
          }
        };

        teacherPc.onicecandidate = (e) => {
          if (e.candidate) {
            teacherSocket.emit('WEBRTC_ICE_CANDIDATE', {
              protocolVersion: '1.0.0',
              packetId: 'pkt_ice_t',
              packetType: 'WEBRTC_ICE_CANDIDATE',
              senderId: 'teacher',
              senderType: 'server',
              timestamp: Date.now(),
              payload: {
                sessionId: 'stream_test_e2e_real',
                senderId: 'teacher',
                targetId: '01010101-0101-0101-0101-010101010101',
                candidate: {
                  candidate: e.candidate.candidate,
                  sdpMid: e.candidate.sdpMid,
                  sdpMLineIndex: e.candidate.sdpMLineIndex,
                },
              },
            });
          }
        };

        // Wire socket signals to PeerConnections
        agentSocket.on('WEBRTC_ICE_CANDIDATE', async (env) => {
          if (env.payload?.candidate) {
            await agentPc.addIceCandidate(new RTCIceCandidate(env.payload.candidate));
          }
        });

        teacherSocket.on('WEBRTC_ICE_CANDIDATE', async (env) => {
          if (env.payload?.candidate) {
            await teacherPc.addIceCandidate(new RTCIceCandidate(env.payload.candidate));
          }
        });

        // 7. Teacher requests SCREEN_CAPTURE_START
        log('6. Docente emite SCREEN_CAPTURE_START al Gateway...');
        const sessionCreatedPromise = new Promise((resolve) => {
          teacherSocket.once('WEBRTC_SESSION_CREATED', resolve);
        });

        teacherSocket.emit('SCREEN_CAPTURE_START', {
          protocolVersion: '1.0.0',
          packetId: 'pkt_start_01',
          packetType: 'SCREEN_CAPTURE_START',
          senderId: 'teacher',
          senderType: 'server',
          timestamp: Date.now(),
          payload: {
            teacherId: 'cccccccc-cccc-cccc-cccc-cccccccccccc',
            deviceId: '01010101-0101-0101-0101-010101010101',
            sessionId: 'stream_test_e2e_real',
            qualityTier: 'thumbnail',
          },
        });

        await sessionCreatedPromise;
        log('7. Sesión de streaming creada en Gateway (WEBRTC_SESSION_CREATED)');

        // 8. Agent creates Real SDP Offer
        const offer = await agentPc.createOffer();
        await agentPc.setLocalDescription(offer);
        log(`8. Agente generó SDP Offer real (${offer.sdp.length} bytes, H264/VP8/SRTP)`);

        agentSocket.emit('WEBRTC_OFFER', {
          protocolVersion: '1.0.0',
          packetId: 'pkt_offer_01',
          packetType: 'WEBRTC_OFFER',
          senderId: '01010101-0101-0101-0101-010101010101',
          senderType: 'agent',
          timestamp: Date.now(),
          payload: {
            sessionId: 'stream_test_e2e_real',
            targetDeviceId: '01010101-0101-0101-0101-010101010101',
            teacherId: 'teacher',
            sdp: offer.sdp,
          },
        });

        // 9. Teacher receives Offer, sets remote description and sends Answer
        teacherSocket.on('WEBRTC_OFFER', async (env) => {
          log('7. Docente recibió SDP Offer a través de AgentGateway. Creando Answer...');
          await teacherPc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: env.payload.sdp }));
          const answer = await teacherPc.createAnswer();
          await teacherPc.setLocalDescription(answer);

          teacherSocket.emit('WEBRTC_ANSWER', {
            packetType: 'WEBRTC_ANSWER',
            senderId: 'teacher',
            senderType: 'server',
            timestamp: Date.now(),
            payload: {
              sessionId: 'stream_test_e2e_real',
              deviceId: '01010101-0101-0101-0101-010101010101',
              targetTeacherId: 'teacher',
              sdp: answer.sdp,
            },
          });
        });

        agentSocket.on('WEBRTC_ANSWER', async (env) => {
          log('9. Agente recibió SDP Answer a través de AgentGateway. Estableciendo descripción remota...');
          await agentPc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: env.payload.sdp }));
        });

        // Wait for track and connection
        await trackReceivedPromise;

        // Monitor connection and stats
        log('10. Esperando establecimiento de ICE y decodificación de cuadros...');
        await new Promise((resolve) => {
          const checkInterval = setInterval(async () => {
            const iceState = teacherPc.iceConnectionState;
            const connState = teacherPc.connectionState;
            log(`[ESTADO WEBRTC] ICE: ${iceState}, Conn: ${connState}, Video Dimensions: ${videoEl.videoWidth}x${videoEl.videoHeight}`);

            if (iceState === 'connected' || connState === 'connected' || videoEl.videoWidth > 0) {
              const stats = await teacherPc.getStats();
              let framesDecoded = 0;
              let bytesReceived = 0;

              stats.forEach((report) => {
                if (report.type === 'inbound-rtp' && report.kind === 'video') {
                  framesDecoded = report.framesDecoded || 0;
                  bytesReceived = report.bytesReceived || 0;
                }
              });

              if (framesDecoded > 0 || videoEl.videoWidth > 0) {
                log(`>>> ÉXITO CONFIRMADO: Cuadros decodificados: ${framesDecoded}, Bytes recibidos: ${bytesReceived}, Resolución: ${videoEl.videoWidth}x${videoEl.videoHeight} <<<`);
                clearInterval(checkInterval);
                resolve();
              }
            }
          }, 500);
        });

        log('================================================================');
        log('>>> TEST RESULT: PASSED (TRANSMISIÓN WEBRTC REAL VERIFICADA) <<<');
        log('================================================================');
        window.TEST_COMPLETED = true;
        window.TEST_RESULT = 'PASSED';
      } catch (err) {
        log(`ERROR EN TEST: ${err.message}`);
        console.error(err);
        window.TEST_COMPLETED = true;
        window.TEST_RESULT = 'FAILED: ' + err.message;
      }
    }

    window.onload = runTest;
  </script>
</body>
</html>
